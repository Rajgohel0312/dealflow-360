<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="zapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  <rect width="124" height="124" x="2" y="2" rx="26" fill="none" stroke="#818CF8" stroke-width="2" stroke-opacity="0.4" />

  <!-- Outer Ring Orbit -->
  <circle cx="64" cy="64" r="46" fill="none" stroke="#A5B4FC" stroke-width="3" stroke-dasharray="8 6" opacity="0.3" />

  <!-- Lightning Zap Icon -->
  <path d="M 68 20 L 38 68 H 62 L 56 108 L 90 56 H 66 L 72 20 Z" fill="url(#zapGrad)" filter="url(#glow)" />
</svg>